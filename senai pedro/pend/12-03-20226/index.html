<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Produtos</title>

    <link rel="stylesheet" href="./css/main.css" />

    <script src="./js/scripts.js" defer></script>
  </head>
  <body>
    <section class="container__cards">
      <div class="card">
        <div class="circle" style="--clr: #f40009">
          <img src="./assets/images/cocaCola_logo.png" alt="" class="logo" />
        </div>

        <div class="content">
          <h2>Coca Cola</h2>
          <p>Lorem ipsum da Coca Cola</p>
          <a href="#">Explore More</a>
        </div>
        <img src="./assets/images/coca_cola.png" alt="" class="product__img" />
      </div>
      <div class="card">
        <div class="circle" style="--clr: #008b47">
          <img src="./assets/images/sprite_logo.svg" alt="" class="logo" />
        </div>

        <div class="content">
          <h2>Sprite</h2>
          <p>Lorem ipsum da Sprite</p>
          <a href="#">Explore More</a>
        </div>
        <img src="./assets/images/sprite.png" alt="" class="product__img" />
      </div>
      <div class="card">
        <div class="circle" style="--clr: #ffd700">
          <img src="./assets/images/cotuba_logo.png" alt="" class="logo" />
        </div>

        <div class="content">
          <h2>Cotuba</h2>
          <p>Lorem ipsum da Cotuba</p>
          <a href="#">Explore More</a>
        </div>
        <img src="./assets/images/cotuba.png" alt="" class="product__img" />
      </div>
      <div class="card">
        <div class="circle" style="--clr: #ff5f17">
          <img
            src="./assets/images/fantaLaranja_logo.png"
            alt=""
            class="logo"
          />
        </div>

        <div class="content">
          <h2>Fanta Laranja</h2>
          <p>Lorem ipsum da Fanta Laranja</p>
          <a href="#">Explore More</a>
        </div>
        <img
          src="./assets/images/fantaLaranja.png"
          alt=""
          class="product__img"
        />
      </div>
    </section>
  </body>
</html>
